version: 2
config:
  output_dir: ${OUTPUT_DIR}
  memory_limit: 1GB
  state_file: ./runs.csv
  show_graph: False
  show_stacktrace: true
  parameter_defaults:
    #STUDENT_ID_NAME: 'edFi_studentUniqueID' # default to the column added by the apply_xwalk package of student ID xwalking feature edFi_studentUniqueID
    #POSSIBLE_STUDENT_ID_COLUMNS: 'PS_StudentID,StudentSUNS'
    DESCRIPTOR_NAMESPACE: uri://ed-fi.org
  
sources:
  input:
    file: ${INPUT_FILE}
    header_rows: 1
  
transformations:
  input:
    source: $sources.input
    operations: []
  
  stage_source:
    source: $sources.input
    operations: 
      - operation:  rename_columns
        columns:  
          /ed-fi/schools/educationOrganizationCategories[0].educationOrganizationCategoryDescriptor:  educationOrganizationCategory_0
          /ed-fi/schools/educationOrganizationCategories[1].educationOrganizationCategoryDescriptor:  educationOrganizationCategory_1
          /ed-fi/schools/educationOrganizationCategories[2].educationOrganizationCategoryDescriptor:  educationOrganizationCategory_2
          /ed-fi/schools/educationOrganizationCategories[3].educationOrganizationCategoryDescriptor:  educationOrganizationCategory_3
          /ed-fi/schools/educationOrganizationCategories[n].educationOrganizationCategoryDescriptor:  educationOrganizationCategory_n
          /ed-fi/schools/gradeLevels[0].gradeLevelDescriptor: gradeLevel_0
          /ed-fi/schools/gradeLevels[1].gradeLevelDescriptor: gradeLevel_1
          /ed-fi/schools/gradeLevels[2].gradeLevelDescriptor: gradeLevel_2
          /ed-fi/schools/gradeLevels[3].gradeLevelDescriptor: gradeLevel_3
          /ed-fi/schools/gradeLevels[4].gradeLevelDescriptor: gradeLevel_4
          /ed-fi/schools/gradeLevels[5].gradeLevelDescriptor: gradeLevel_5
          /ed-fi/schools/gradeLevels[6].gradeLevelDescriptor: gradeLevel_6
          /ed-fi/schools/gradeLevels[7].gradeLevelDescriptor: gradeLevel_7
          /ed-fi/schools/gradeLevels[8].gradeLevelDescriptor: gradeLevel_8
          /ed-fi/schools/schoolId:  schoolId
          /ed-fi/schools/charterApprovalSchoolYearTypeReference.schoolYear: charterApprovalSchoolYear
          /ed-fi/schools/localEducationAgencyReference.localEducationAgencyId:  localEducationAgencyId
          /ed-fi/schools/addresses[0].addressTypeDescriptor:  addressType
          /ed-fi/schools/addresses[0].stateAbbreviationDescriptor:  state
          /ed-fi/schools/addresses[0].city: city
          /ed-fi/schools/addresses[0].postalCode: postalCode
          /ed-fi/schools/addresses[0].streetNumberName: streetNumberName
          /ed-fi/schools/addresses[0].localeDescriptor: locale
          /ed-fi/schools/addresses[0].buildingSiteNumber: buildingSiteNumber
          /ed-fi/schools/addresses[0].doNotPublishIndicator:  addressDoNotPublishIndicator
          /ed-fi/schools/addresses[0].nameOfCounty: nameOfCounty
          /ed-fi/schools/addresses[0].periods[n].beginDate: addressPeriodBeginDate
          /ed-fi/schools/addresses[0].periods[n].endDate: addressPeriodEndDate
          /ed-fi/schools/administrativeFundingControlDescriptor: administrativeFundingControl
          /ed-fi/schools/charterApprovalAgencyTypeDescriptor: charterApprovalAgencyType
          /ed-fi/schools/charterStatusDescriptor: charterStatus
          /ed-fi/schools/identificationCodes[0].educationOrganizationIdentificationSystemDescriptor:  EdOrgIdSystem_0
          /ed-fi/schools/identificationCodes[0].identificationCode: identificationCode_0
          /ed-fi/schools/identificationCodes[1].educationOrganizationIdentificationSystemDescriptor:  EdOrgIdSystem_1
          /ed-fi/schools/identificationCodes[1].identificationCode: identificationCode_1
          /ed-fi/schools/identificationCodes[2].educationOrganizationIdentificationSystemDescriptor:  EdOrgIdSystem_2
          /ed-fi/schools/identificationCodes[2].identificationCode: identificationCode_2
          /ed-fi/schools/institutionTelephones[0].institutionTelephoneNumberTypeDescriptor: phoneType_0
          /ed-fi/schools/institutionTelephones[0].telephoneNumber:  telephoneNumber_0
          /ed-fi/schools/institutionTelephones[1].institutionTelephoneNumberTypeDescriptor: phoneType_1
          /ed-fi/schools/institutionTelephones[1].telephoneNumber:  telephoneNumber_1
          /ed-fi/schools/internetAccessDescriptor:  internetAccess
          /ed-fi/schools/magnetSpecialProgramEmphasisSchoolDescriptor:  magnetProgram
          /ed-fi/schools/nameOfInstitution: nameOfInstitution
          /ed-fi/schools/operationalStatusDescriptor: operationalStatus
          /ed-fi/schools/schoolCategories[0].schoolCategoryDescriptor:  schoolCategory_0
          /ed-fi/schools/schoolCategories[1].schoolCategoryDescriptor:  schoolCategory_1
          /ed-fi/schools/schoolCategories[2].schoolCategoryDescriptor:  schoolCategory_2
          /ed-fi/schools/schoolTypeDescriptor:  schoolType
          /ed-fi/schools/shortNameOfInstitution:  shortNameOfInstitution
          /ed-fi/schools/titleIPartASchoolDesignationDescriptor:  titleIPartASchoolDesignation
          /ed-fi/schools/webSite: webSite
      - operation: add_columns
        columns:
          namespace:  ${DESCRIPTOR_NAMESPACE}

  prepare_schools:
    source: $transformations.stage_source
    operations:
      - operation:  combine_columns
        columns:
          {% if gradeLevel_0 != '' %}
          - gradeLevel_0
          {%endif%}
          {% if gradeLevel_1 != '' %}
          - gradeLevel_1
          {%endif%}
          {% if gradeLevel_2 != '' %}
          - gradeLevel_2
          {%endif%}
          {% if gradeLevel_3 != '' %}
          - gradeLevel_3
          {%endif%}
          {% if gradeLevel_4 != '' %}
          - gradeLevel_4
          {%endif%}
          {% if gradeLevel_5 != '' %}
          - gradeLevel_5
          {%endif%}
          {% if gradeLevel_6 != '' %}
          - gradeLevel_6
          {%endif%}
          {% if gradeLevel_7 != '' %}
          - gradeLevel_7
          {%endif%}
          {% if gradeLevel_8 != '' %}
          - gradeLevel_8
          {%endif%}
        new_column: gradeLevel_list
        separator:  ","      
      - operation:  combine_columns
        columns:
          {% if educationOrganizationCategory_0 != '' %}
          - educationOrganizationCategory_0
          {%endif%}
          {% if educationOrganizationCategory_1 != '' %}
          - educationOrganizationCategory_1
          {%endif%}
          {% if educationOrganizationCategory_2 != '' %}
          - educationOrganizationCategory_2
          {%endif%}
          {% if educationOrganizationCategory_3 != '' %}
          - educationOrganizationCategory_3
          {%endif%}
          {% if educationOrganizationCategory_n != '' %}
          - educationOrganizationCategory_n
          {%endif%}
        new_column: edOrgCategory_list
        separator:  ","
      - operation:  combine_columns
        columns:
          {% if schoolCategory_0 != '' %}
          - schoolCategory_0
          {%endif%}
          {% if schoolCategory_1 != '' %}
          - schoolCategory_1
          {%endif%}
          {% if schoolCategory_2 != '' %}
          - schoolCategory_2
          {%endif%}
        new_column: schoolCategory_list
        separator:  ","

destinations:
  schools:
    source: $transformations.prepare_schools
    template: ./templates/schools.jsont
    extension: jsonl