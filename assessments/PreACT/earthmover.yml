version: 2
config:
  output_dir: ${OUTPUT_DIR}
  memory_limit: 1GB
  state_file: ./runs.csv
  show_graph: False
  show_stacktrace: true
  parameter_defaults:
    STUDENT_ID_NAME: 'edFi_studentUniqueID' # default to the column added by the apply_xwalk package of student ID xwalking feature edFi_studentUniqueID
    POSSIBLE_STUDENT_ID_COLUMNS: 'Stu_ID_Num'
    DESCRIPTOR_NAMESPACE: uri://ed-fi.org
  
sources:
  input:
    file: ${INPUT_FILE}
    colspec_file: ./seed/colspecs.csv   # required
    colspec_headers:
      name: Field Name / Column Header                  # required
      start: start                # required if `width` is not provided
      end: end                    # required if `width` is not provided
      width: length               # required if `start` or `end` is not provided
    type: fixedwidth               # required if `file` does not end with '.txt'
    header_rows: 0
  assessments:
    file: ./seeds/assessments.csv
    header_rows: 1
  objectiveAssessments:
    file: ./seeds/objectiveAssessments.csv
    header_rows: 1
  assessmentReportingMethodDescriptors:
    file: ./seeds/assessmentReportingMethodDescriptors.csv
    header_rows: 1

  gradeLevelDescriptors:
    file: ./seeds/gradeLevelDescriptors.csv
    header_rows: 1

transformations:
  input:
    source: $sources.input
    operations: []
     
  grade_level_descriptors:
    source: $sources.gradeLevelDescriptors
    operations:
      - operation: add_columns
        columns:
          crossJoinId: "AssessmentGrades"
      - operation: add_columns
        columns:
          grade_json: >
              {%raw-%}  
              {
                "gradeLevelDescriptor": "{{namespace}}#{{codeValue}}"
              }
              {%-endraw%}
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{grade_json | replace('\n', '')-}}{%endraw%}"
      - operation: group_by
        group_by_columns:
          - crossJoinId
        create_columns: 
          grade_json: agg(grade_json,,)
  


  stage_assessments:
    source: $sources.assessments
    operations:
      - operation: add_columns
        columns:
          crossJoinId: "AssessmentGrades"

  prepare_assessments:
    source: $transformations.stage_assessments
    operations:
      - operation: join
        sources:
          - $transformations.grade_level_descriptors
        join_type: inner
        left_key: crossJoinId
        right_key: crossJoinId
      - operation: add_columns
        columns:         
          descriptorNamespace: ${DESCRIPTOR_NAMESPACE}


  prepare_objective_assessments:
    source: $sources.objectiveAssessments
    operations:
      - operation: add_columns
        columns:
          assessmentIdentifier: "PreACT"
      - operation: add_columns
        columns:
          descriptorNamespace: ${DESCRIPTOR_NAMESPACE}
     
destinations:
  assessments:
    source: $transformations.prepare_assessments
    template: ./templates/assessments.jsont
    extension: jsonl
  objectiveAssessments:
    source: $transformations.prepare_objective_assessments
    template: ./templates/objectiveAssessments.jsont
    extension: jsonl
  
  assessmentReportingMethodDescriptors:
    source: $sources.assessmentReportingMethodDescriptors
    template: ./templates/assessmentReportingMethodDescriptors.jsont
    extension: jsonl
